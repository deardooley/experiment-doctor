#cloud-config
# Secret-free bootstrap only. Credentials and reviewed release arrive over SSH.
package_update: true
packages:
  - uidmap
  - dbus-user-session
  - slirp4netns
  - fuse-overlayfs
  - ca-certificates
  - curl
users:
  - default
  - name: doctor-api
    system: true
    shell: /usr/sbin/nologin
  - name: doctor-worker
    system: true
    shell: /usr/sbin/nologin
  - name: doctor-runner
    shell: /bin/bash
    lock_passwd: true
write_files:
  - path: /usr/local/lib/experiment-doctor/setup-runtime
    permissions: '0700'
    content: |
      ${indent(6, setup_runtime)}
  - path: /usr/local/lib/experiment-doctor/setup-control
    permissions: '0700'
    content: |
      ${indent(6, setup_control)}
  - path: /usr/local/lib/experiment-doctor/setup-delivery
    permissions: '0700'
    content: |
      ${indent(6, setup_delivery)}
runcmd:
  - [bash, /usr/local/lib/experiment-doctor/setup-runtime]
  - [bash, /usr/local/lib/experiment-doctor/setup-delivery]
